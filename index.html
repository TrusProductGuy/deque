<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Andy Trus — application for Director of Product Management at Deque." />
<title>Andy Trus — Director of Product Management</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Source+Sans+3:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />

<script>
const CONFIG = {

  company:  "Deque",
  role:     "Director of Product Management",
  resume:   "Andy_Trus_Resume_Deque.pdf",
  year:     "2026",

  eyebrow: "DIRECTOR OF PRODUCT MANAGEMENT  ·  DEQUE",

  headline: {
    line1: "AI can ship code faster than teams can check it.",
    line2: "I've spent 14 years leading product where what ships has to be right."
  },

  heroSub: "In assessments, a wrong answer or a broken experience lands in front of a student as soon as it ships, so quality was never a finishing step. For 14 years, I've built strategy, teams, and roadmaps in B2B environments, from leading product for WebAssign, a $100M+ a year platform, to building a new product team and operating model at McGraw Hill. That's the experience I'd bring to Deque.",

  stats: [
    { value: "$100M+", label: "YEARLY REVENUE PLATFORM WHERE I LED PRODUCT" },
    { value: "21%",    label: "STATISTICS PRODUCT LINE GROWTH OVER 3 YEARS, OUTPERFORMING OTHER LINES" },
    { value: "$2.75M", label: "SAVED BY AN AI CONTENT-REVIEW TOOL I LAUNCHED" }
  ],

  whyTitle: "Why Deque and why this role",
  whyBullets: [
    "<strong>Mission: Continuing the Theme of My Career</strong> I've spent much of my career building inclusive learning products, focused on students who needed it the most. I love the idea of continuing that theme at Deque, where the mission is digital equality.",
    "<strong>AI: Helping Software Teams Keep Up With Themselves</strong> I work AI-first, and I'm drawn to a company helping teams build accessibly as AI changes how software gets built. That's the problem behind my headline, and one I'd like to spend my time on.",
    "<strong>Role: Building How a Product Organization Works</strong> This role starts as an individual contributor and helps shape PM practices as the team grows. Building how a product organization works is the part of every job I've enjoyed most."
  ],



  bringTitle: "What I'd bring to the role",
  cards: [
    { title: "Strategy for products that have to work as one platform",
      body: "I oversaw a 40+ person cross-functional team on the strategy and planning to fold a $15M+ Chemistry offering into the unified WebAssign Math and Science platform, to reduce churn and the cost of maintaining two similar products. As Product Director, I focused WebAssign's roadmap on what mattered most for retention, which improved CSAT and beat forecast with 10% unit growth over two years." },
    { title: "Discovery that reaches customers and sales directly",
      body: "I rebuilt how product, engineering, and sales work together on customer discovery and go-to-market, so launches were tied to customer needs and business results. At McGraw Hill, I built a team to do the engineering work behind third-party assessment integrations for state-wide sales." },
    { title: "A visible voice with customers and in public",
      body: "This role needs a strong champion for accessibility who can also speak publicly, and the posting asks for strong speaking, writing, and presenting skills. I've spent much of my career in roles where I was highly visible with customers, on webinars, and representing my product line. I've also written articles to support product launches and spoken at an internal product conference of about 1,000 employees." },
    { title: "Setting direction, and growing the people who run with it",
      body: "For most of my career, Product Owners and technical PMs have handled day-to-day execution while I set the direction. At WebAssign, I set new discovery and collaboration practices and mentored two Associate PMs who were promoted within one and two years. Today I manage two PMs at McGraw Hill, where the measures I defined for a new product team became the standard across K-12 product lines." },
    { title: "AI-first: I use it to build, to coach, and to shape strategy",
      body: "I use AI coding and prototyping tools every day. At McGraw Hill, I started a committee to bring AI prototyping across K-12 product teams, and I built an AI agent that raises the quality of my team's product requirements." },
    { title: "I've prioritized a product through a formal accessibility audit, twice",
      body: "This past year at McGraw Hill, my team worked through a backlog of accessibility tickets and the product passed its formal audit. I helped the team work out solutions to the different issues and prioritized the work. I did the same at WebAssign many years ago." }
  ],



  valuesTitle: "How I align with Deque's core values",
  values: [
    { name: "Innovation with results that matter",
      body: "I care about new ideas that move a number the business or a customer would notice. At McGraw Hill, I launched an AI tool that saved $2.75M in vendor content review costs. At WebAssign, I took a Gen AI math solution from idea to proof of concept in 90 days." },
    { name: "Deliver what you promise",
      body: "I plan to the commitments I make. On the Statistics line, I managed a budget of about $500K a year and launched a textbook under budget that grew 40%. At WebAssign, I beat forecast with 10% unit growth over two years." },
    { name: "Can-do attitude",
      body: "Four times, I've started a role with no playbook, and each time the job was to build one. My Statistics team was named Team of the Year Runner-Up, out of 30 teams, for collaboration and operational excellence." },
    { name: "Open, direct and respectful communications",
      body: "I make progress visible to everyone. At McGraw Hill, I built the measurement dashboards that became the standard across K-12 product lines. At WebAssign, I set up new discovery and collaboration practices across the team." },
    { name: "We care deeply",
      body: "My work has been for students who most need a product to work for them. I spearheaded a 0-to-1 assessment line that placed over 150K students into math courses, and I've worked through accessibility backlogs to get products through formal audits." },
    { name: "We practice humility",
      body: "I built an AI system that reviews my own 1:1 notes and coaching commitments, so I can grade how well I'm managing and see where I'm falling short. The questions on this page are hypotheses I'd want to test with customers, not conclusions I'm bringing in." }
  ],

  questions: [
    "Deque's research says AI-generated code is adding to accessibility debt. When coding agents write and fix much of the code, who is the user of an accessibility product: the developer, the accessibility lead, or the agent? I'd want to work out how that changes what discovery means.",
    "Axe has more than 5 billion downloads, and Axe MCP Server now has a free plan for scanning. When the engine and the first scan are free, what makes a team pay: compliance confidence, coverage across a whole site, or time saved on fixes? I'd expect the answer to differ by buyer, and I'd want to test it with customers and non-customers.",
    "Regulation has set the pace of accessibility spending: the European Accessibility Act already applies, and the US ADA Title II deadlines for larger public entities moved out a year to 2027. When deadlines slip, what keeps customers investing: legal risk, their own customers' requirements, or a view of accessibility as part of quality? I'd want to learn which one a roadmap should be built around."
  ],


  closing: "I'd welcome the chance to talk any of this through, and to hear where Deque's view differs from mine.",

  linkedin: "linkedin.com/in/andy-trus",
  email: "trus.productguy@gmail.com",
  phone: "301-461-6166"
};
</script>

<style>
  :root {
    --ink:      #1A2038;
    --accent:   #4A3F9E;
    --bg:       #F6F5FA;
    --mark:     #9A4F08;
    --charcoal: #26283A;
    --white:    #FFFFFF;
    --line:     rgba(26,32,56,0.16);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--charcoal);
    font-family: 'Source Sans 3', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-family: 'Fraunces', serif; margin: 0; color: var(--ink); }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { animation: none !important; transition: none !important; }
  }

  .skip-link {
    position: absolute; left: 12px; top: -60px; z-index: 10;
    background: var(--ink); color: var(--white); padding: 10px 16px; border-radius: 4px;
    font-weight: 600; text-decoration: none;
  }
  .skip-link:focus { top: 12px; }

  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 28px; }

  .divider { width: 100%; height: 28px; display: block; }
  .divider line { stroke: var(--mark); stroke-width: 2; opacity: 0.55; }
  .divider circle { fill: var(--mark); opacity: 0.8; }

  header { padding: 40px 0 0; }
  .eyebrow {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px; letter-spacing: 0.12em; color: var(--accent);
    margin: 0 0 22px;
  }

  .hero { padding: 8px 0 36px; }
  .hero h1 {
    font-size: clamp(34px, 5.4vw, 56px);
    line-height: 1.1;
    font-weight: 500;
    letter-spacing: -0.01em;
  }
  .hero h1 em { font-style: italic; color: var(--accent); }
  .hero-sub {
    margin: 22px 0 0; font-size: 19px; line-height: 1.6;
    max-width: 780px; color: var(--charcoal);
  }

  .stats {
    display: grid; grid-template-columns: repeat(3, 1fr);
    border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    margin: 30px 0 44px; padding: 0; list-style: none;
  }
  .stat { padding: 22px 16px; text-align: left; border-left: 1px solid var(--line); }
  .stat:first-child { border-left: none; }
  .stat-value { font-family: 'Fraunces', serif; font-size: clamp(19px, 2.6vw, 26px); color: var(--ink); font-weight: 500; }
  .stat-label {
    font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.06em;
    color: var(--accent); margin-top: 6px; text-transform: uppercase;
  }

  .why { padding: 8px 0 46px; }
  .why h2 { font-size: 26px; font-weight: 500; margin-bottom: 16px; }
  .why-list { margin: 0; padding: 0; list-style: none; max-width: 820px; }
  .why-list li {
    position: relative; padding: 12px 0 12px 24px; font-size: 17px; line-height: 1.65;
    border-bottom: 1px solid var(--line);
  }
  .why-list li:first-child { border-top: 1px solid var(--line); }
  .why-list li::before {
    content: "\2013"; position: absolute; left: 0; color: var(--mark); font-weight: 600;
  }

  .bring { padding: 10px 0 50px; }
  .bring h2 { font-size: 26px; font-weight: 500; margin-bottom: 24px; }
  .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .card {
    background: var(--white); border: 1px solid var(--line); border-radius: 6px;
    padding: 26px 24px; border-top: 3px solid var(--mark);
  }
  .card h3 { font-size: 18.5px; font-weight: 500; margin-bottom: 10px; line-height: 1.3; }
  .card p { font-size: 15.5px; line-height: 1.62; color: var(--charcoal); margin: 0; }

  .values { padding: 10px 0 50px; }
  .values h2 { font-size: 26px; font-weight: 500; margin-bottom: 24px; }
  .values-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 40px; margin: 0; padding: 0; list-style: none; }
  .value { padding: 18px 0 20px; border-top: 1px solid var(--line); }
  .value h3 { font-size: 18.5px; font-weight: 500; margin-bottom: 8px; line-height: 1.3; }
  .value p { font-size: 15.5px; line-height: 1.62; margin: 0; }

  .questions { padding: 10px 0 50px; }
  .questions h2 { font-size: 26px; font-weight: 500; margin-bottom: 22px; }
  .q-list { margin: 0; padding: 0; list-style: none; }
  .q-item {
    display: flex; gap: 16px; padding: 18px 0; border-bottom: 1px solid var(--line);
  }
  .q-item:first-child { border-top: 1px solid var(--line); }
  .q-num { font-family: 'IBM Plex Mono', monospace; color: var(--mark); font-weight: 500; font-size: 14px; padding-top: 2px; min-width: 22px; }
  .q-text { font-size: 16.5px; line-height: 1.6; }

  .closing { padding: 6px 0 44px; }
  .closing p { font-family: 'Fraunces', serif; font-size: clamp(22px, 3vw, 30px); line-height: 1.35; font-weight: 500; font-style: italic; color: var(--accent); max-width: 760px; margin: 0; }

  footer {
    padding: 40px 0 60px; border-top: 1px solid var(--line); margin-top: 10px;
  }
  .foot-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 18px; }
  .foot-name { font-family: 'Fraunces', serif; font-size: 20px; color: var(--ink); }
  .foot-links a {
    color: var(--accent); text-decoration: underline; text-underline-offset: 3px; font-size: 14.5px; margin-left: 20px;
  }
  .foot-links a:first-child { margin-left: 0; }
  .foot-links a.resume-btn {
    display: inline-block; background: var(--ink); color: var(--white);
    padding: 10px 20px; border-radius: 4px; font-weight: 500; text-decoration: none;
  }
  .foot-links a.resume-btn:hover { background: var(--accent); }
  .credit { margin: 22px 0 0; font-size: 13px; color: #55586B; }

  a:focus-visible, button:focus-visible { outline: 3px solid var(--mark); outline-offset: 2px; }

  @media (max-width: 680px) {
    .card-grid { grid-template-columns: 1fr; }
    .values-grid { grid-template-columns: 1fr; }
    .stats { grid-template-columns: 1fr; }
    .stat { border-left: none; border-top: 1px solid var(--line); }
    .stat:first-child { border-top: none; }
    .foot-row { flex-direction: column; align-items: flex-start; }
    .foot-links a { margin-left: 0; margin-right: 18px; }
  }
</style>
</head>
<body>

<a class="skip-link" href="#main">Skip to main content</a>

<div class="wrap">
  <header>
    <p class="eyebrow" id="eyebrow"></p>
  </header>

  <main id="main">
    <section class="hero" aria-labelledby="headline">
      <h1 id="headline"></h1>
      <p class="hero-sub" id="heroSub"></p>
    </section>

    <svg class="divider" viewBox="0 0 900 28" preserveAspectRatio="none" aria-hidden="true" focusable="false"><line x1="0" y1="14" x2="420" y2="14"/><circle cx="440" cy="14" r="4"/><circle cx="450" cy="14" r="4"/><circle cx="460" cy="14" r="4"/><line x1="480" y1="14" x2="900" y2="14"/></svg>

    <ul class="stats" id="stats" aria-label="Highlights"></ul>

    <section class="why" aria-labelledby="whyTitle">
      <h2 id="whyTitle"></h2>
      <div id="why"></div>
    </section>

    <section class="bring" aria-labelledby="bringTitle">
      <h2 id="bringTitle"></h2>
      <div class="card-grid" id="cards"></div>
    </section>

    <section class="values" aria-labelledby="valuesTitle">
      <h2 id="valuesTitle"></h2>
      <ul class="values-grid" id="values"></ul>
    </section>

    <svg class="divider" viewBox="0 0 900 28" preserveAspectRatio="none" aria-hidden="true" focusable="false"><line x1="0" y1="14" x2="420" y2="14"/><circle cx="440" cy="14" r="4"/><circle cx="450" cy="14" r="4"/><circle cx="460" cy="14" r="4"/><line x1="480" y1="14" x2="900" y2="14"/></svg>

    <section class="questions" aria-labelledby="qTitle">
      <h2 id="qTitle">Questions I'm sitting with</h2>
      <ol class="q-list" id="questions"></ol>
    </section>

    <section class="closing" aria-label="Closing">
      <p id="closing"></p>
    </section>
  </main>

  <footer>
    <div class="foot-row">
      <div class="foot-name" id="footName"></div>
      <nav class="foot-links" id="footLinks" aria-label="Contact and résumé"></nav>
    </div>
    <p class="credit">Built with Claude.</p>
  </footer>
</div>

<script>
  document.title = "Andy Trus — " + CONFIG.role;
  document.getElementById('eyebrow').textContent = CONFIG.eyebrow;

  document.getElementById('headline').innerHTML =
    CONFIG.headline.line1 + " <em>" + CONFIG.headline.line2 + "</em>";

  document.getElementById('heroSub').textContent = CONFIG.heroSub;

  document.getElementById('stats').innerHTML = CONFIG.stats.map(s => `
    <li class="stat">
      <div class="stat-value">${s.value}</div>
      <div class="stat-label">${s.label}</div>
    </li>
  `).join('');

  document.getElementById('whyTitle').textContent = CONFIG.whyTitle;
  document.getElementById('why').innerHTML = '<ul class="why-list">' +
    CONFIG.whyBullets.map(b => `<li>${b}</li>`).join('') +
    '</ul>';

  document.getElementById('bringTitle').textContent = CONFIG.bringTitle;
  document.getElementById('cards').innerHTML = CONFIG.cards.map(c => `
    <div class="card">
      <h3>${c.title}</h3>
      <p>${c.body}</p>
    </div>
  `).join('');

  document.getElementById('valuesTitle').textContent = CONFIG.valuesTitle;
  document.getElementById('values').innerHTML = CONFIG.values.map(v => `
    <li class="value">
      <h3>${v.name}</h3>
      <p>${v.body}</p>
    </li>
  `).join('');

  document.getElementById('questions').innerHTML = CONFIG.questions.map((q,i) => `
    <li class="q-item">
      <span class="q-num" aria-hidden="true">0${i+1}</span>
      <span class="q-text">${q}</span>
    </li>
  `).join('');

  document.getElementById('closing').textContent = CONFIG.closing;

  document.getElementById('footName').textContent = "Andy Trus · " + CONFIG.year;
  document.getElementById('footLinks').innerHTML = `
    <a href="mailto:${CONFIG.email}">${CONFIG.email}</a>
    <a href="https://${CONFIG.linkedin}">${CONFIG.linkedin}</a>
    <a class="resume-btn" href="${CONFIG.resume}">View Résumé</a>
  `;
</script>
</body>
</html>
